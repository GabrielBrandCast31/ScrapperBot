# Override de DESENVOLVIMENTO. Aplica em cima de docker-compose.yml.
#
# Uso:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d --build
#
# Diferencas pra prod:
#   - api      : volume mount do codigo + FLASK_DEBUG=true (hot-reload)
#   - frontend : Dockerfile.dev (Vite + HMR) + volume mount do codigo
#   - waha     : monta ./waha_data/ no host (em vez de volume named)

services:
  api:
    environment:
      - FLASK_APP=main.py
      - FLASK_DEBUG=true
    volumes:
      - .:/app
      - ./data:/app/data
      - ./chroma_data:/app/chroma_data
    command: ["flask", "run", "--host=0.0.0.0", "--port=5000", "--debug"]

  frontend:
    build:
      dockerfile: Dockerfile.dev
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - VITE_API_TARGET=http://api:5000

  waha:
    volumes:
      - ./waha_data:/app/data
