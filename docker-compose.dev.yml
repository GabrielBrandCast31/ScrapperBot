# Override de DESENVOLVIMENTO. Aplica em cima de docker-compose.yml.
#
# Uso:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d --build
#
# Diferencas pra prod:
#   - api      : volume mount do codigo + FLASK_DEBUG=true (reload em mudanca)
#   - frontend : usa Dockerfile.dev (Vite dev server com HMR) e volume mount
#   - data/    : monta a pasta local em vez de volume nomeado (mais facil
#                pra inspecionar o banco/exports no editor)

services:
  api:
    environment:
      - FLASK_APP=main.py
      - FLASK_DEBUG=true
    volumes:
      # Hot-reload: codigo vivo
      - .:/app
      # Mantem ./data/ no host (em vez de volume named) pra editor local ver
      - ./data:/app/data
      - ./chroma_data:/app/chroma_data
    command: ["flask", "run", "--host=0.0.0.0", "--port=5000", "--debug"]

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    volumes:
      # Hot reload do codigo + node_modules vindo da imagem
      - ./frontend:/app
      - /app/node_modules
    environment:
      - VITE_API_TARGET=http://api:5000

  waha:
    volumes:
      # Mantem ./waha_data/ no host em dev (pra debug do estado do Chromium
      # se necessario). Em prod usa volume named.
      - ./waha_data:/app/data
