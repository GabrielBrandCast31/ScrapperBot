# Override de DESENVOLVIMENTO do BACKEND. Aplica em cima de docker-compose.yml.
#
# Uso:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d --build
#
# Diferencas pra prod:
#   - api  : volume mount do codigo + FLASK_DEBUG=true (reload em mudanca)
#   - waha : monta ./waha_data/ no host (em vez de volume named) pra debug
#
# Frontend NAO eh gerenciado por este compose (vive em projeto separado).
# Pra rodar o frontend em dev:  cd ../frontend && docker compose -f ... up

services:
  api:
    environment:
      - FLASK_APP=main.py
      - FLASK_DEBUG=true
    volumes:
      # Hot-reload: codigo vivo
      - .:/app
      # Mantem ./data/ no host (em vez de volume named) pra editor local ver
      - ./data:/app/data
      - ./chroma_data:/app/chroma_data
    command: ["flask", "run", "--host=0.0.0.0", "--port=5000", "--debug"]

  waha:
    volumes:
      # Mantem ./waha_data/ no host em dev (pra debug do estado do Chromium
      # se necessario). Em prod usa volume named.
      - ./waha_data:/app/data
