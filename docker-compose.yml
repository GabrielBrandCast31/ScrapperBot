# BACKEND — stack de produçao.
#
# Servicos deste compose:
#   - waha :  ponte WhatsApp <-> HTTP (so localhost do host)
#   - api  :  backend Flask + auditoria IA + importadores
#
# O FRONTEND vive em projeto separado (../frontend) e sobe via seu proprio
# docker-compose.yml. Ambos conversam pela network `wpp_net`, declarada
# aqui e marcada como `external: true` no frontend.
#
# Ordem ao subir tudo:
#   1) backend:  cd AgenteWPPAutomation && docker compose up -d
#   2) frontend: cd ../frontend && docker compose up -d
#
# Pra dev (hot-reload do backend):
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up

networks:
  wpp_net:
    name: wpp_net

volumes:
  waha_data:
  app_data:
  chroma_data:

services:
  waha:
    image: devlikeapro/waha:latest
    container_name: wpp_bot_waha
    platform: linux/amd64
    restart: always
    ports:
      # Dashboard so do servidor (use SSH tunnel pra acessar de fora).
      - '127.0.0.1:3030:3000'
    environment:
      - WHATSAPP_API_KEY=minha-chave-secreta
      - WAHA_DASHBOARD_USERNAME=admin
      - WAHA_DASHBOARD_PASSWORD=admin
      - WAHA_LOCAL_STORE_BASE_DIR=/app/data
      - WHATSAPP_FILES_FOLDER=/app/data/files
    volumes:
      - waha_data:/app/data
    networks:
      - wpp_net

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    image: wpp_bot_api:latest
    container_name: wpp_bot_api
    restart: always
    ports:
      # Backend exposto na LAN. Pra fechar pra fora, use 127.0.0.1:5050:5000.
      - '5050:5000'
    environment:
      # FLASK_DEBUG nao seta = modo prod (sem reloader, threads iniciam direto)
      - FLASK_APP=main.py
    env_file:
      # OPENAI_API_KEY, GEMINI_API_KEY etc. O .env nao entra na imagem
      # (por causa do .dockerignore); aqui o compose le e injeta como env vars.
      - .env
    volumes:
      - app_data:/app/data
      - chroma_data:/app/chroma_data
    depends_on:
      - waha
    networks:
      - wpp_net
