# Stack completa em UM compose. 3 servicos:
#   - waha     :  ponte WhatsApp <-> HTTP (so localhost do host)
#   - api      :  backend Flask + auditoria IA + importadores
#   - frontend :  React (TanStack Start) servido por Bun em modo SSR
#
# Volumes nomeados pra estado:
#   - waha_data, app_data, chroma_data
#
# Em prod NAO ha volume mount de codigo — as imagens contem tudo.
# Pra dev (hot-reload), use:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up

services:
  waha:
    image: devlikeapro/waha:latest
    container_name: wpp_bot_waha
    platform: linux/amd64
    restart: always
    ports:
      - '127.0.0.1:3030:3000'
    environment:
      - WHATSAPP_API_KEY=minha-chave-secreta
      - WAHA_DASHBOARD_USERNAME=admin
      - WAHA_DASHBOARD_PASSWORD=admin
      - WAHA_LOCAL_STORE_BASE_DIR=/app/data
      - WHATSAPP_FILES_FOLDER=/app/data/files
    volumes:
      - waha_data:/app/data

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    image: wpp_bot_api:latest
    container_name: wpp_bot_api
    restart: always
    ports:
      - '5050:5000'
    environment:
      - FLASK_APP=main.py
    env_file:
      - .env
    volumes:
      # Bind mount em vez de volume named: o banco SQLite (data/messages.db)
      # e os .txt em data/chat_exports/ vivem no filesystem do projeto,
      # versionados via git. Assim a VPS recebe os dados via `git pull`.
      - ./data:/app/data
      - chroma_data:/app/chroma_data
    depends_on:
      - waha

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: wpp_bot_frontend:latest
    container_name: wpp_bot_frontend
    restart: always
    ports:
      - '4173:3000'
    environment:
      # Proxy /api -> service `api` na network interna do compose
      - VITE_API_TARGET=http://api:5000
    depends_on:
      - api

volumes:
  waha_data:
  chroma_data:
